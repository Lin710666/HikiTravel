# 一键部署：docker compose up -d --build
# 访问 http://localhost:8000
#
# 前置：在项目根目录创建 .env，填写 AMAP_API_KEY（高德开放平台免费申请）
# Ollama 默认连接宿主机 11434 端口；也可用「ollama」profile 一并启动容器版：
#   docker compose --profile ollama up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelplanner
    ports:
      - "8000:8000"
    environment:
      AMAP_API_KEY: ${AMAP_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      DB_PATH: /app/data/travelplanner.db
    volumes:
      - ./backend/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 可选：容器化 Ollama（默认不启动，需显式 --profile ollama）
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
